<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>You're offline | Profaile</title>
  <style>
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: #000; color: #fff; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 440px; text-align: center; }
    .mark { display: inline-grid; place-items: center; width: 58px; height: 58px; margin-bottom: 20px; border: 1px solid #3b82f6; border-radius: 16px; background: #0b182c; color: #fff; font-size: 32px; font-weight: 800; }
    h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.2; }
    p { margin: 0 0 24px; color: #aaa; }
    a { display: inline-block; padding: 11px 20px; border-radius: 999px; background: #3b82f6; color: #fff; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body><main><span class="mark" aria-hidden="true">p.</span><h1>You're offline</h1><p>Reconnect to view or edit your portfolio. Your private drafts are only available online.</p><a href="/">Try again</a></main></body>
</html>
