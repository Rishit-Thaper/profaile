name: Keep Supabase Alive

on:
  schedule:
    # Ping every 5 minutes so the Supabase project / serverless functions
    # don't go idle and the portfolio stays warm.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  keep-alive:
    name: Ping profaile.app
    runs-on: ubuntu-latest
    steps:
      - name: Hit portfolio URL
        run: |
          url="https://www.profaile.app/p/thaperrishit"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 30 -A "profaile-keep-alive" "$url")
            echo "Attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "OK"
              exit 0
            fi
            sleep 10
          done
          echo "Ping failed after 3 attempts"
          exit 1
