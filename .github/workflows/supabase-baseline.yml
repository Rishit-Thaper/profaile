name: Record existing Supabase migrations

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type APPLIED_001_TO_005 only after verifying all five SQL files already ran in production"
        required: true
        type: string

permissions:
  contents: read

jobs:
  baseline:
    if: inputs.confirmation == 'APPLIED_001_TO_005'
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify Supabase credentials are configured
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD'; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo 'Missing SUPABASE_PROJECT_ID'; exit 1; }
      - uses: supabase/setup-cli@v3
        with:
          version: 3.3.0
      - name: Link production database
        run: supabase link "$SUPABASE_PROJECT_ID"
      - name: Record SQL Editor migrations in history
        shell: bash
        run: |
          set -euo pipefail
          for version in 20261124000101 20261124000102 20261124000103 20261124000104 20261124000105; do
            supabase migration repair "$version" --status applied --remote --yes
          done
          supabase migration list --remote
